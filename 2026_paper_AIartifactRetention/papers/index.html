<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文獻清單 — AI生成物留存率</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>body{font-family:'Noto Sans TC',sans-serif}</style>
<script src="papers.js"></script>
</head>
<body class="bg-slate-100 text-slate-800">
<header class="bg-slate-900 text-white"><div class="max-w-4xl mx-auto px-4 py-8">
<a href="../../index.html" class="text-slate-400 text-sm hover:text-white">所有資料夾</a>
<h1 class="text-2xl font-bold mt-2">文獻清單</h1>
<p id="count" class="text-slate-400 text-sm mt-1"></p></div></header>
<main class="max-w-4xl mx-auto px-4 py-6 space-y-3" id="list"></main>
<script>
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const STAGES={A:'Stage A · 領域背景知識',B:'Stage B · 近三年相關研究'};
const stageOf=p=>p.group.startsWith('B')?'B':'A';
const groups=[...new Set(PAPERS.map(p=>p.group))];
const ps=[...PAPERS].sort((a,b)=>groups.indexOf(a.group)-groups.indexOf(b.group)||(a.emerging?1:0)-(b.emerging?1:0)||a.year-b.year);
const n=k=>ps.filter(p=>stageOf(p)===k).length;
document.getElementById('count').textContent=`${ps.length} 篇 · Stage A ${n('A')} 篇 · Stage B ${n('B')} 篇（原文 PDF 不入庫）`;
document.getElementById('list').innerHTML=ps.map((p,i)=>{
  const prev=ps[i-1];
  let head='';
  if(!prev||stageOf(p)!==stageOf(prev)) head+=`<h2 class="text-lg font-bold text-slate-900 pt-6 border-b border-slate-300 pb-1">${STAGES[stageOf(p)]}</h2>`;
  if(!prev||p.group!==prev.group) head+=`<h3 class="text-sm font-bold text-slate-500 pt-3">${esc(p.group)}</h3>`;
  const meta=[esc(p.venueShort||''),p.year,esc(p.license||''),p.citations?'引用 '+esc(p.citations):''].filter(Boolean).join(' · ');
  return head+`<a href="paper.html?id=${encodeURIComponent(p.id)}" class="block bg-white rounded-lg border border-slate-200 hover:border-violet-300 p-4">
<p class="text-xs text-slate-400">${p.emerging?'<span class="text-emerald-700 font-semibold">🌱 新興 · </span>':''}${meta}</p>
<p class="font-semibold text-slate-900">${esc(p.titleZh||p.title)}</p>
<p class="text-sm text-slate-500 mt-1">${esc(p.apa.replace(/\*/g,''))}</p></a>`;
}).join('');
</script>
</body></html>
